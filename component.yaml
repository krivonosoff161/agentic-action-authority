{
  "schema_version": "AgenticSecurityEcosystemComponent.v1",
  "component_id": "agentic-action-authority",
  "display_name": "Agentic Action Authority",
  "repository": "https://github.com/krivonosoff161/agentic-action-authority",
  "visibility": "public",
  "kind": "support_adapter",
  "summary": "Separately owned exact-action approval core with an optional Harness create-only file adapter; no automatic extension loading.",
  "package": {
    "name": "agentic-action-authority",
    "version": "0.4.0",
    "install": "Follow the versioned 0.4.0 installation in README.md; check the index entry and release evidence before treating publication as complete. See docs/releases/v0.4.0.md for scope.",
    "entry_points": [
      "action-authority-operator",
      "action-authority-host"
    ]
  },
  "owns": {
    "modules": [
      "exact-action-approval-core"
    ],
    "checks": [
      "signed-request-binding",
      "one-attempt-coordination",
      "installed-core-and-adapter-parity"
    ],
    "collectors": [],
    "adapters": [
      "harness-create-only-file",
      "agent-framework-declaration-only-document"
    ],
    "contracts": [
      "action-authority-file-v1",
      "action-authority-generic-v2"
    ]
  },
  "consumes": [
    "operator-enrolled public key and detached signed decisions",
    "host-owned exact payload and declared dependency digests",
    "optional agentic-security-harness==1.14.2 file writer",
    "optional agent-framework-core==1.23.0 declaration-only route"
  ],
  "contracts": [
    {
      "id": "action-authority-file",
      "version": "1",
      "direction": "provides",
      "required": true
    },
    {
      "id": "action-authority-generic",
      "version": "2",
      "direction": "provides",
      "required": false
    },
    {
      "id": "harness-workspace-operation",
      "version": "1.14.2",
      "direction": "consumes",
      "required": false
    }
  ],
  "docs": [
    {
      "path": "README.md",
      "role": "component-front-door"
    },
    {
      "path": "docs/architecture.md",
      "role": "component-owned"
    },
    {
      "path": "docs/one-document.md",
      "role": "component-owned"
    },
    {
      "path": "docs/provenance.md",
      "role": "historical"
    },
    {
      "path": "docs/verification.md",
      "role": "component-owned"
    },
    {
      "path": "docs/agent-framework.md",
      "role": "component-owned"
    },
    {
      "path": "docs/releases/v0.4.0.md",
      "role": "release-scope"
    },
    {
      "path": "SECURITY.md",
      "role": "component-owned"
    }
  ],
  "compatibility": {
    "harness_api": "optional workspace operation 1.14.2",
    "python": ">=3.11",
    "platforms": {
      "supported": [
        "linux",
        "windows"
      ],
      "tested": [
        "linux",
        "windows"
      ]
    }
  },
  "integration_status": "standalone",
  "evidence_refs": [
    "tests/test_core.py",
    "tests/test_native_parity.py",
    "tests/test_process.py",
    "tests/test_agent_framework.py",
    "tools/check_installed_wheel.py",
    ".github/workflows/checks.yml"
  ],
  "claims": [
    "Harness-free base import",
    "optional adapter reuses the Harness file writer",
    "signed exact-action operator decision verification"
  ],
  "non_claims": [
    "arbitrary tool sandbox",
    "semantic truth or injection-free content",
    "universal exactly-once delivery",
    "independent external effectiveness review",
    "automatic host authority from installation",
    "part of the historical six-component functional chain"
  ],
  "authority": "none"
}
